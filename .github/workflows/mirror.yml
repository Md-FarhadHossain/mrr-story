name: Mirror to Client Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to client repo
        run: |
          git remote add client https://x-access-token:${{ secrets.CLIENT_TOKEN }}@github.com/mrrstory/mrr-story.git
          git push client main --force
